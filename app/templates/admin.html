{% extends "base.html" %}
{% block page_content %}

    <div class="page-header">
        <h1>设置</h1>
    </div>

    <div>
        <h3>站点设置</h3>
        <p>个人博客名称：</p>
        <p>{{ details['chronofile_name'] }} {% if user.role == 'admin' %}<a class="btn btn-default" href="{{ url_for('admin.rename_chronofile') }}">编辑</a>{% endif %}</p>
    </div>
    </br>
    <div>
        <h3>个人资料</h3>
        <p>昵称：</p>
        <p>{{ details['author_name'] }} <a class="btn btn-default" href="{{ url_for('admin.rename_author') }}">编辑</a></p>
    </div>
    </br>
    <div>
        <p>修改登录账号：</p>
        <p><a class="btn btn-default" href="{{ url_for('auth.change_account') }}">点击此处</a></p>
    </div>
    </br>
    <div>
        <p>修改密码：</p>
        <p><a class="btn btn-default" href="{{ url_for('auth.change_password') }}">点击此处</a></p>
    </div>

{% endblock %}
