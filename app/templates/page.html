{% extends "base.html" %}
{% block page_content %}
<div class="page-header"><h1>社区动态 · 第 {{ page }} 页</h1></div>
<div class="post-grid">
{% for post in entries_for_page %}{% include '_post_card.html' %}{% endfor %}
</div>
<nav class="feed-pagination">
{% if prev_page %}<a class="btn btn-default" href="{{ url_for('main.view_entries_for_page', page=prev_page) if prev_page > 1 else url_for('main.browse_all_entries') }}">更新的记录</a>{% endif %}
{% if next_page %}<a class="btn btn-default" href="{{ url_for('main.view_entries_for_page', page=next_page) }}">更早的记录</a>{% endif %}
</nav>
{% endblock %}
