{% extends "base.html" %}
{% block page_content %}

<div class="settings-layout">
    <nav class="settings-nav">
        <a href="{{ url_for('user.settings_profile') }}" class="active">个人资料</a>
        <a href="{{ url_for('user.settings_music') }}">音乐管理</a>
        <a href="{{ url_for('user.view_user_profile', user_id=session.user_id) }}">查看主页</a>
    </nav>

    <div class="settings-panel">
        <h2>编辑个人资料</h2>

        <form method="post" enctype="multipart/form-data" class="settings-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="nickname">昵称</label>
                <input type="text" id="nickname" name="nickname" value="{{ profile.nickname }}" maxlength="30" required>
                <p class="help-text">其他用户将看到你的昵称</p>
            </div>

            <div class="form-group">
                <label for="bio">个人简介</label>
                <textarea id="bio" name="bio" rows="4" maxlength="500">{{ profile.bio }}</textarea>
                <p class="help-text">最多500字</p>
            </div>

            <div class="form-group">
                <label for="avatar">头像</label>
                {% if profile.avatar %}
                <div style="margin-bottom: 8px;">
                    <img src="{{ url_for('static', filename=profile.avatar) }}" alt="当前头像" style="width: 64px; height: 64px; border-radius: 12px; object-fit: cover;">
                </div>
                {% endif %}
                <input type="file" id="avatar" name="avatar" accept="image/*">
                <p class="help-text">支持 jpg、png、gif、webp，不超过 5MB</p>
            </div>

            <div class="form-group">
                <label for="background_image">主页背景图</label>
                {% if profile.background_image %}
                <div style="margin-bottom: 8px;">
                    <img src="{{ url_for('static', filename=profile.background_image) }}" alt="当前背景" style="width: 200px; height: 100px; border-radius: 8px; object-fit: cover;">
                </div>
                {% endif %}
                <input type="file" id="background_image" name="background_image" accept="image/*">
                <p class="help-text">建议尺寸 1920x1080，支持 jpg、png、webp</p>
            </div>

            <button type="submit" class="btn btn-default">保存修改</button>
        </form>
    </div>
</div>

{% endblock %}
